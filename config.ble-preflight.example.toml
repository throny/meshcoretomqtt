# Preparation template only. Never deploy as-is or enable a broker from this file.
# Replace XXX, endpoints, audiences, and BLE address only after independent approval.
# Keep this file root-owned, group-readable only by the service group, mode 0640.

[general]
iata = "XXX"
log_level = "INFO"
transport = "ble"

[ble]
address = "REPLACE_WITH_CONFIRMED_BONDED_BLE_ADDRESS"

[remote_serial]
enabled = false

[[broker]]
name = "meshmapper-placeholder"
enabled = false
server = "REPLACE_WITH_MESHMapper_ENDPOINT"
port = 443
transport = "websockets"

[broker.tls]
enabled = true
verify = true

[broker.auth]
method = "token"
audience = "REPLACE_WITH_MESHMapper_AUDIENCE"

[[broker]]
name = "letsmesh-placeholder"
enabled = false
server = "REPLACE_WITH_LetsMesh_ENDPOINT"
port = 443
transport = "websockets"

[broker.tls]
enabled = true
verify = true

[broker.auth]
method = "token"
audience = "REPLACE_WITH_LetsMesh_AUDIENCE"
